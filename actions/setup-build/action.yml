name: Set up mod build
description: Install JDKs and configure Gradle toolchains
inputs:
  java: {description: Newline-separated JDK versions, required: true}
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '${{ inputs.java }}'
    - shell: bash
      env:
        JAVA_VERSIONS: '${{ inputs.java }}'
      run: |
        mkdir -p "$HOME/.gradle"
        vars=$(printf '%s\n' "$JAVA_VERSIONS" | sed '/^$/d;s/^/JAVA_HOME_/;s/$/_X64/' | paste -sd, -)
        printf '\norg.gradle.java.installations.fromEnv=%s\norg.gradle.java.installations.auto-download=false\n' "$vars" >> "$HOME/.gradle/gradle.properties"
        chmod +x gradlew
    - uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: "${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}"
        validate-wrappers: true
